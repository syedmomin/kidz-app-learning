<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
      <feOffset dx="3" dy="3" result="offsetblur" />
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8A80" />
      <stop offset="100%" style="stop-color:#FF5252" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#80D8FF" />
      <stop offset="100%" style="stop-color:#40C4FF" />
    </linearGradient>
  </defs>
  <rect width="300" height="200" fill="#E3F2FD" rx="20" />
  
  <!-- Block A -->
  <g filter="url(#shadow)" transform="translate(60, 60)">
    <rect width="80" height="80" rx="10" fill="url(#grad1)" />
    <text x="40" y="55" text-anchor="middle" font-family="Arial" font-weight="900" font-size="45" fill="white">A</text>
  </g>
  
  <!-- Block B -->
  <g filter="url(#shadow)" transform="translate(160, 70)">
    <rect width="80" height="80" rx="10" fill="url(#grad2)" />
    <text x="40" y="55" text-anchor="middle" font-family="Arial" font-weight="900" font-size="45" fill="white">B</text>
  </g>
</svg>
